<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atreus</title>
    <!-- La landing se mudó a su propio repositorio (NicolasRomanBlanco/atreus-web) el 2026-09-01,
         porque ".../atreus-privacy/app.html" era una URL fea para enseñar el producto. Este
         fichero se queda como puente: hay enlaces vivos a la URL vieja (LinkedIn, mensajes
         ya enviados) y sin él darían 404.
         El <link rel="canonical"> es lo que impide que Google indexe las dos como contenido
         duplicado, y el <meta name="robots"> deja fuera esta cáscara. NO le pongas fecha de
         "última actualización": no es una página legal. -->
    <link rel="canonical" href="https://nicolasromanblanco.github.io/atreus-web/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://nicolasromanblanco.github.io/atreus-web/" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #5f6368;
        --link: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #e6e6e6;
          --muted: #a3a3ab;
          --link: #7ab8ff;
        }
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        max-width: 520px;
        margin: 0 auto;
        padding: 64px 20px;
        line-height: 1.6;
        color: var(--fg);
        background: var(--bg);
        text-align: center;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <h1>Atreus</h1>
    <p>Esta página se ha mudado. / This page has moved.</p>
    <p>
      <a href="https://nicolasromanblanco.github.io/atreus-web/"
        >https://nicolasromanblanco.github.io/atreus-web/</a
      >
    </p>
    <script>
      location.replace('https://nicolasromanblanco.github.io/atreus-web/');
    </script>
  </body>
</html>
